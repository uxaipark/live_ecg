[workspace]
resolver = "2"
members = [
    "crates/ecg-wfdb",
    "crates/ecg-dsp",
    "crates/ecg-quality",
    "crates/ecg-beats",
    "crates/ecg-qrs",
    "crates/ecg-rhythm",
    "crates/ecg-pipeline",
    "crates/ecg-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
debug = true
