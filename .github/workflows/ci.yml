name: ci

# The WFDB corpora are not in the repository, so the metric regression tests
# report that they skipped rather than asserting on data they cannot see. What
# CI can prove is that the engine builds clean, lints clean, and that every
# test which does not need a corpus still passes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release -- --nocapture
