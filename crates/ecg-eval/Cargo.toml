[package]
name = "ecg-eval"
version.workspace = true
edition.workspace = true

[dependencies]
ecg-wfdb = { path = "../ecg-wfdb" }
ecg-zarr = { path = "../ecg-zarr" }
ecg-dsp = { path = "../ecg-dsp" }
ecg-qrs = { path = "../ecg-qrs" }
ecg-quality = { path = "../ecg-quality" }
ecg-pipeline = { path = "../ecg-pipeline" }
ecg-server = { path = "../ecg-server" }
ecg-rhythm = { path = "../ecg-rhythm" }
ecg-beats = { path = "../ecg-beats" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "60.0.0", default-features = false, features = ["snap", "zstd"] }

[lib]
name = "ecg_eval"
path = "src/lib.rs"

[[bin]]
name = "ecg-eval"
path = "src/main.rs"
