[package]
name = "ecg-eval"
version.workspace = true
edition.workspace = true

[dependencies]
ecg-wfdb = { path = "../ecg-wfdb" }
ecg-dsp = { path = "../ecg-dsp" }
ecg-qrs = { path = "../ecg-qrs" }
ecg-quality = { path = "../ecg-quality" }
ecg-pipeline = { path = "../ecg-pipeline" }
ecg-rhythm = { path = "../ecg-rhythm" }
ecg-beats = { path = "../ecg-beats" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ecg-eval"
path = "src/main.rs"
